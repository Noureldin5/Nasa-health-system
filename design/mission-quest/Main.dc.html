<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Quests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1220;color:#E6ECF5;font-family:'IBM Plex Sans',system-ui,sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:#9AA8BF}
.q{display:flex;align-items:center;gap:14px;padding:14px;background:#121B2E;border:1px solid #23304A;border-radius:10px;min-height:44px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div><div style="font-size: 13px; color: #3DD6C3; font-weight: 600; letter-spacing: 0.04em">MISSION QUEST</div>
<h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 600">Day 142 goals</h1></div>
<div class="mono" style="font-size: 14px; color: #F5BF55">12 day streak</div>
</div>

<div style="display: flex; align-items: center; gap: 20px; background: #121B2E; border: 1px solid #23304A; border-radius: 10px; padding: 18px">
<svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="Mission health score 82 out of 100">
<circle cx="52" cy="52" r="44" fill="none" stroke="#1D2A44" stroke-width="10"/>
<circle cx="52" cy="52" r="44" fill="none" stroke="#3DD6C3" stroke-width="10" stroke-linecap="round" stroke-dasharray="227 277" transform="rotate(-90 52 52)"/>
<text x="52" y="60" text-anchor="middle" fill="#E6ECF5" font-size="28" font-weight="600" font-family="IBM Plex Mono, monospace">82</text>
</svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 16px; font-weight: 600">Mission health score</div>
<div class="muted" style="font-size: 13px; line-height: 1.5">Up 4 this week. Sleep and exercise moved it most.</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px" class="muted">Today, 3 of 5 done</div>
<sc-for list="{{quests}}" as="q" hint-placeholder-count="5">
<div class="q">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true" style="flex: none"><circle cx="13" cy="13" r="11" fill="{{q.fill}}" stroke="{{q.stroke}}" stroke-width="2"/><path d="{{q.tick}}" fill="none" stroke="#06201D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 500">{{q.title}}</div><div class="muted" style="font-size: 12px; margin-top: 2px">{{q.sub}}</div></div>
<div class="mono" style="font-size: 13px; color: {{q.xpColor}}">{{q.xp}}</div>
</div>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span class="muted">Next badge: Steady Sleeper</span><span class="mono">4 of 7 nights</span></div>
<div style="height: 8px; border-radius: 4px; background: #1D2A44; overflow: hidden"><div style="height: 100%; width: 57%; background: #F5BF55"></div></div>
<div class="muted" style="font-size: 12px; margin-top: 6px">Quests are reminders, never requirements. Skipping one is never reported.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const done = (title, sub, xp) => ({ title, sub, xp, fill: '#3DD6C3', stroke: '#3DD6C3', tick: 'M7.5 13.5 11.5 17.5 18.5 9', xpColor: '#3DD6C3' });
    const todo = (title, sub, xp) => ({ title, sub, xp, fill: 'none', stroke: '#4A5C80', tick: '', xpColor: '#9AA8BF' });
    return {
      quests: [
        done('Morning check-in', 'Took 22 seconds', '+10'),
        done('Blood pressure reading', 'Cuff on the left arm, 2 minutes', '+15'),
        done('Resistance exercise', '45 minutes, bone and muscle care', '+25'),
        todo('Hydration check', 'Log two bottles by 16:00', '+5'),
        todo('Lights out by 22:00', 'Dim cabin lights at 21:00', '+20'),
      ],
    };
  }
}
</script>
</body>
</html>
