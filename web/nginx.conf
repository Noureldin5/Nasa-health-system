server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /api/x -> api:8000/x, the same rewrite as the Vite dev proxy.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }

  # Single-page app: unknown paths load index.html so react-router can handle them.
  location / {
    try_files $uri /index.html;
  }
}
