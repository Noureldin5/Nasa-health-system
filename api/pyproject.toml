[project]
name = "own-your-baseline-api"
version = "0.1.0"
description = "Station-server API for Own Your Baseline (decision support, not diagnosis)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running VictoriaMetrics"]

[tool.ruff]
line-length = 100
target-version = "py312"
